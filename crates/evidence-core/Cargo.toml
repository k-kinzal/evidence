[package]
name = "evidence-core"
description = "Evidence: provenance, freshness, and coverage of everything you collect, derive, and write (library behind the CLI and the wiki)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["evidence", "provenance", "lineage", "osint"]

[features]
default = []
## SQLite full-text index for faster search (FTS5, trigram). Search works without it.
index = ["dep:rusqlite"]

[dependencies]
cas-fs = { workspace = true, features = ["serde"] }
figment.workspace = true
ignore.workspace = true
jiff.workspace = true
jsonschema = { workspace = true, features = ["resolve-file"] }
rusqlite = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
span-select = { workspace = true, features = ["serde", "schemars"] }
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
