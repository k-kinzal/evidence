# cargo-deny configuration: `cargo deny check`.

[graph]
all-features = true

[advisories]
# Unmaintained crates reached only through GPUI (the desktop app) are reviewed when GPUI is
# upgraded; everything else must be maintained.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "NCSA",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
# Duplicate versions are reported, not fatal: several come from GPUI and gix and cannot be
# unified from this workspace.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
